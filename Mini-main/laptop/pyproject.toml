[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mini-laptop"
version = "0.1.0"
description = "Mini laptop execution environment: MCP policy proxy, transactional staging, Ed25519 approval contracts, glass-box monitor."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "TBD" }
authors = [{ name = "Mini Team" }]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Framework :: FastAPI",
]
dependencies = [
    # Web / daemon
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8,<3",
    "sse-starlette>=2.1",
    "httpx>=0.27",
    "pyyaml>=6.0",
    # MCP protocol (SDK v2: MCPServer / low-level Server, streamable_http_app, stdio_client)
    "mcp>=2.0,<3",
    # Security & crypto
    "cryptography>=43",
    "rfc8785>=0.1.4",
    # Gmail integration (scopes: gmail.readonly + gmail.compose only)
    "google-api-python-client>=2.140",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[project.scripts]
mini = "mini.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mini"]

[tool.hatch.build.targets.wheel.force-include]
"src/mini/daemon/static" = "mini/daemon/static"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning:google.*"]
